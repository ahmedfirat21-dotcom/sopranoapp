<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;background:transparent;overflow:hidden;display:flex;align-items:center;justify-content:center}

@keyframes gem-float{0%,100%{transform:translateY(0) rotate(-1.5deg)}50%{transform:translateY(-3px) rotate(1.5deg)}}
@keyframes shine-march{0%{transform:translateX(-160px)}100%{transform:translateX(160px)}}
@keyframes facet-bright{0%,100%{opacity:0.15}50%{opacity:0.55}}
@keyframes facet-bright-2{0%,100%{opacity:0.4}50%{opacity:0.85}}
@keyframes halo-breathe{0%,100%{opacity:0.25}50%{opacity:0.7}}
@keyframes orbit-cw{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}
@keyframes orbit-ccw{0%{transform:rotate(360deg)}100%{transform:rotate(0deg)}}
@keyframes ray-rotate{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}
@keyframes ring-expand{0%{opacity:0.9;transform:scale(0.85)}100%{opacity:0;transform:scale(1.45)}}
@keyframes bg-shimmer{0%,100%{opacity:0.05}50%{opacity:0.18}}
@keyframes star-twinkle-pop{0%,100%{opacity:0;transform:scale(0)}35%,65%{opacity:1;transform:scale(1)}}

.gem-float{animation:gem-float 3s ease-in-out infinite;transform-origin:100px 100px;transform-box:view-box}
.shine-band{animation:shine-march 3.2s ease-in-out infinite}
.facet-1{animation:facet-bright 2.4s ease-in-out infinite}
.facet-2{animation:facet-bright-2 2.8s ease-in-out infinite;animation-delay:0.4s}
.facet-3{animation:facet-bright 3.2s ease-in-out infinite;animation-delay:0.8s}
.facet-4{animation:facet-bright-2 2.6s ease-in-out infinite;animation-delay:1.2s}
.star-1{animation:star-twinkle-pop 2.4s ease-in-out infinite;transform-origin:75px 60px;transform-box:view-box}
.star-2{animation:star-twinkle-pop 2.8s ease-in-out infinite;animation-delay:0.6s;transform-origin:130px 80px;transform-box:view-box}
.star-3{animation:star-twinkle-pop 2.2s ease-in-out infinite;animation-delay:1.1s;transform-origin:60px 100px;transform-box:view-box}
.star-4{animation:star-twinkle-pop 3s ease-in-out infinite;animation-delay:1.6s;transform-origin:115px 120px;transform-box:view-box}
.star-5{animation:star-twinkle-pop 2.6s ease-in-out infinite;animation-delay:0.3s;transform-origin:90px 55px;transform-box:view-box}
.halo{animation:halo-breathe 3s ease-in-out infinite}
.orbiter-cw{animation:orbit-cw 7s linear infinite;transform-origin:100px 100px;transform-box:view-box}
.orbiter-ccw{animation:orbit-ccw 9s linear infinite;transform-origin:100px 100px;transform-box:view-box}
.rays{animation:ray-rotate 18s linear infinite;transform-origin:100px 100px;transform-box:view-box}
.ring-A{animation:ring-expand 2.6s ease-out infinite;transform-origin:100px 100px;transform-box:view-box}
.ring-B{animation:ring-expand 2.6s ease-out infinite;animation-delay:1.3s;transform-origin:100px 100px;transform-box:view-box}
.bg-glow{animation:bg-shimmer 4s ease-in-out infinite}
</style>
</head>
<body>
<svg width="220" height="220" viewBox="0 0 200 200">
<defs>
<linearGradient id="dynGem3" x1="20%" y1="0%" x2="80%" y2="100%">
<stop offset="0%" stop-color="#FFE082"/>
<stop offset="35%" stop-color="#FAC775"/>
<stop offset="70%" stop-color="#EF9F27"/>
<stop offset="100%" stop-color="#854F0B"/>
</linearGradient>
<linearGradient id="topShine3" x1="0%" y1="0%" x2="0%" y2="100%">
<stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.7"/>
<stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
</linearGradient>
<linearGradient id="sideDark3" x1="0%" y1="0%" x2="100%" y2="0%">
<stop offset="0%" stop-color="#000000" stop-opacity="0.3"/>
<stop offset="100%" stop-color="#000000" stop-opacity="0"/>
</linearGradient>
<radialGradient id="bgGlow3" cx="50%" cy="50%">
<stop offset="0%" stop-color="#FAC775" stop-opacity="0.5"/>
<stop offset="100%" stop-color="#FAC775" stop-opacity="0"/>
</radialGradient>
<linearGradient id="shineBand3" x1="0%" y1="0%" x2="100%" y2="0%">
<stop offset="0%" stop-color="#FFFFFF" stop-opacity="0"/>
<stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.65"/>
<stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
</linearGradient>
<clipPath id="gemClip3"><polygon points="100,40 156,72 156,128 100,160 44,128 44,72"/></clipPath>
</defs>

<g class="bg-glow"><circle cx="100" cy="100" r="90" fill="url(#bgGlow3)"/></g>

<g class="rays" opacity="0.22">
<line x1="100" y1="18" x2="100" y2="34" stroke="#FAC775" stroke-width="1.5" stroke-linecap="round"/>
<line x1="100" y1="166" x2="100" y2="182" stroke="#FAC775" stroke-width="1.5" stroke-linecap="round"/>
<line x1="18" y1="100" x2="34" y2="100" stroke="#FAC775" stroke-width="1.5" stroke-linecap="round"/>
<line x1="166" y1="100" x2="182" y2="100" stroke="#FAC775" stroke-width="1.5" stroke-linecap="round"/>
<line x1="42" y1="42" x2="54" y2="54" stroke="#FAC775" stroke-width="1.2" stroke-linecap="round"/>
<line x1="146" y1="54" x2="158" y2="42" stroke="#FAC775" stroke-width="1.2" stroke-linecap="round"/>
<line x1="42" y1="158" x2="54" y2="146" stroke="#FAC775" stroke-width="1.2" stroke-linecap="round"/>
<line x1="146" y1="146" x2="158" y2="158" stroke="#FAC775" stroke-width="1.2" stroke-linecap="round"/>
</g>

<g class="halo">
<polygon points="100,28 168,68 168,132 100,172 32,132 32,68" fill="none" stroke="#FAC775" stroke-width="0.7"/>
</g>

<polygon class="ring-A" points="100,40 156,72 156,128 100,160 44,128 44,72" fill="none" stroke="#FFE082" stroke-width="1.5"/>
<polygon class="ring-B" points="100,40 156,72 156,128 100,160 44,128 44,72" fill="none" stroke="#EF9F27" stroke-width="1.5"/>

<g class="gem-float">
<polygon points="100,40 156,72 156,128 100,160 44,128 44,72" fill="url(#dynGem3)" stroke="#FFE082" stroke-width="1"/>
<g clip-path="url(#gemClip3)">
<polygon points="100,40 156,72 100,104 44,72" fill="url(#topShine3)" opacity="0.6"/>
<polygon points="156,72 156,128 130,100" fill="url(#sideDark3)" opacity="0.7"/>
</g>
<polygon class="facet-1" points="100,40 130,57 100,74 70,57" fill="#FFFFFF"/>
<polygon class="facet-2" points="100,40 70,57 44,72" fill="#FFE082"/>
<polygon class="facet-3" points="100,40 130,57 156,72" fill="#FFE082"/>
<polygon class="facet-4" points="44,72 70,90 70,110 44,128" fill="#000000" opacity="0.25"/>
<g class="star-1"><path d="M 75 60 L 76.2 63.8 L 80 65 L 76.2 66.2 L 75 70 L 73.8 66.2 L 70 65 L 73.8 63.8 Z" fill="#FFFFFF"/></g>
<g class="star-2"><path d="M 130 80 L 131 83 L 134 84 L 131 85 L 130 88 L 129 85 L 126 84 L 129 83 Z" fill="#FFFFFF"/></g>
<g class="star-3"><circle cx="60" cy="100" r="1.5" fill="#FFFFFF"/></g>
<g class="star-4"><circle cx="115" cy="120" r="1.2" fill="#FFFFFF"/></g>
<g class="star-5"><circle cx="90" cy="55" r="1" fill="#FFFFFF"/></g>
<g clip-path="url(#gemClip3)">
<rect class="shine-band" x="-30" y="20" width="50" height="160" fill="url(#shineBand3)" transform="skewX(-15)"/>
</g>
<text x="100" y="112" text-anchor="middle" font-family="Georgia, serif" font-size="32" font-weight="500" fill="#4A2800">SP</text>
</g>

<g class="orbiter-cw"><circle cx="185" cy="100" r="2.5" fill="#FFE082"/></g>
<g class="orbiter-ccw"><circle cx="15" cy="100" r="2" fill="#FAC775" opacity="0.7"/></g>
</svg>
</body></html>
