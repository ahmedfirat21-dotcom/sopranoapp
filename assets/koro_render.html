<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  @import url('https://fonts.cdnfonts.com/css/cooper-black');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: transparent; width: fit-content; height: fit-content; overflow: hidden; }
  .text {
    font-family: 'Cooper Black', 'Arial Rounded MT Bold', serif;
    font-weight: 900;
    letter-spacing: 0.5px;
    font-size: 160px;
    line-height: 1;
    display: block;
    padding: 10px 6px 20px 2px;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background: linear-gradient(180deg, #fecdd3 0%, #fb7185 30%, #e11d48 65%, #f43f5e 100%);
    filter: drop-shadow(0 4px 8px rgba(0,0,0,0.5)) drop-shadow(2px 2px 0 rgba(100,15,40,0.45));
  }
</style>
</head>
<body>
  <span class="text">Koro</span>
</body>
</html>
