<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  @import url('https://fonts.cdnfonts.com/css/cooper-black');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: transparent; width: fit-content; height: fit-content; overflow: hidden; }
  .text {
    font-family: 'Cooper Black', 'Arial Rounded MT Bold', serif;
    font-weight: 900;
    letter-spacing: 0.5px;
    font-size: 160px;
    line-height: 1;
    display: block;
    padding: 10px 6px 20px 2px;
    background: linear-gradient(180deg, #ffffff 0%, #dde4ee 35%, #b8c2d4 70%, #ccd4e4 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 4px 8px rgba(0,0,0,0.6)) drop-shadow(2px 2px 0 rgba(0,0,0,0.4));
  }
</style>
</head>
<body><span id="el" class="text">Soprano</span></body>
</html>
