<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  @import url('https://fonts.cdnfonts.com/css/cooper-black');
  body { margin: 0; padding: 0; background: transparent; }
  .retro-logo-text {
    font-family: 'Cooper Black', 'Arial Rounded MT Bold', serif;
    font-weight: 900;
    letter-spacing: 0.5px;
    transform: scaleY(1.05);
    display: inline-flex;
    gap: 0px;
    font-size: 120px;
    line-height: 1.1;
    padding: 8px 12px;
  }
  .retro-logo-soprano {
    background: linear-gradient(180deg, #ffffff 0%, #dde4ee 35%, #b8c2d4 70%, #ccd4e4 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 3px 6px rgba(0,0,0,0.6)) drop-shadow(2px 2px 0 rgba(0,0,0,0.4));
  }
  .retro-logo-chat {
    background: linear-gradient(180deg, #b8f0f0 0%, #5ec8c8 30%, #3a9e9e 65%, #4db0a8 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 3px 6px rgba(0,0,0,0.6)) drop-shadow(2px 2px 0 rgba(20,80,70,0.5));
  }
</style>
</head>
<body>
<div id="logo" class="retro-logo-text">
  <span class="retro-logo-soprano">Soprano</span><span class="retro-logo-chat">Chat</span>
</div>
</body>
</html>
