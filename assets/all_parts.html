<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  @import url('https://fonts.cdnfonts.com/css/cooper-black');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: transparent; width: fit-content; height: fit-content; overflow: hidden; }
  .text {
    font-family: 'Cooper Black', 'Arial Rounded MT Bold', serif;
    font-weight: 900;
    letter-spacing: 0.5px;
    font-size: 160px;
    line-height: 1;
    display: block;
    padding: 10px 6px 20px 2px;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  /* Home — mavi #3B82F6 */
  .home {
    background: linear-gradient(180deg, #93c5fd 0%, #60a5fa 30%, #3b82f6 65%, #5b9cf7 100%);
    -webkit-background-clip: text;
    filter: drop-shadow(0 4px 8px rgba(0,0,0,0.6)) drop-shadow(2px 2px 0 rgba(30,50,100,0.5));
  }
  /* Koro — parlak bordeux/rose */
  .koro {
    background: linear-gradient(180deg, #fecdd3 0%, #fb7185 30%, #e11d48 65%, #f43f5e 100%);
    -webkit-background-clip: text;
    filter: drop-shadow(0 4px 8px rgba(0,0,0,0.5)) drop-shadow(2px 2px 0 rgba(100,15,40,0.45));
  }
  /* Mesaj — mor #8B5CF6 */
  .mesaj {
    background: linear-gradient(180deg, #c4b5fd 0%, #a78bfa 30%, #8b5cf6 65%, #9d7bf8 100%);
    -webkit-background-clip: text;
    filter: drop-shadow(0 4px 8px rgba(0,0,0,0.6)) drop-shadow(2px 2px 0 rgba(60,30,100,0.5));
  }
  /* Chat — teal #14B8A6 (orijinal) */
  .chat {
    background: linear-gradient(180deg, #b8f0f0 0%, #5ec8c8 30%, #3a9e9e 65%, #4db0a8 100%);
    -webkit-background-clip: text;
    filter: drop-shadow(0 4px 8px rgba(0,0,0,0.6)) drop-shadow(2px 2px 0 rgba(20,80,70,0.5));
  }
  /* Profil — amber/gold #F59E0B */
  .profil {
    background: linear-gradient(180deg, #FDE68A 0%, #FBBF24 30%, #F59E0B 65%, #D97706 100%);
    -webkit-background-clip: text;
    filter: drop-shadow(0 4px 8px rgba(0,0,0,0.5)) drop-shadow(2px 2px 0 rgba(100,60,0,0.5));
  }
</style>
</head>
<body>
  <span id="home" class="text home">Home</span>
  <span id="koro" class="text koro">Koro</span>
  <span id="mesaj" class="text mesaj">Mesaj</span>
  <span id="chat" class="text chat">Chat</span>
  <span id="profil" class="text profil">Profil</span>
</body>
</html>
