<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <linearGradient id="crown-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFE082"/>
      <stop offset="50%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="gem-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5EEAD4"/>
      <stop offset="100%" stop-color="#14B8A6"/>
    </linearGradient>
    <radialGradient id="aura" cx="50%" cy="55%" r="50%">
      <stop offset="0%" stop-color="rgba(251,191,36,0.45)"/>
      <stop offset="50%" stop-color="rgba(251,191,36,0.12)"/>
      <stop offset="100%" stop-color="rgba(251,191,36,0)"/>
    </radialGradient>
  </defs>

  <!-- Golden aura -->
  <circle cx="200" cy="160" r="120" fill="url(#aura)"/>

  <!-- Radiating light beams -->
  <g transform="translate(200,160)" opacity="0.35" fill="rgba(251,191,36,0.7)">
    <path d="M -2 -120 L 2 -120 L 0 -70 Z"/>
    <path d="M -2 120 L 2 120 L 0 70 Z"/>
    <path d="M -120 -2 L -120 2 L -70 0 Z"/>
    <path d="M 120 -2 L 120 2 L 70 0 Z"/>
    <g transform="rotate(45)">
      <path d="M -2 -110 L 2 -110 L 0 -65 Z"/>
      <path d="M -2 110 L 2 110 L 0 65 Z"/>
      <path d="M -110 -2 L -110 2 L -65 0 Z"/>
      <path d="M 110 -2 L 110 2 L 65 0 Z"/>
    </g>
  </g>

  <!-- Crown -->
  <g transform="translate(200,160)">
    <!-- Base band -->
    <rect x="-60" y="20" width="120" height="22" rx="4" fill="url(#crown-grad)" stroke="#92400E" stroke-width="1.5"/>
    <!-- Five peaks -->
    <path d="M -60 20 L -45 -25 L -30 10 L -15 -35 L 0 5 L 15 -35 L 30 10 L 45 -25 L 60 20 Z"
          fill="url(#crown-grad)" stroke="#92400E" stroke-width="1.5" stroke-linejoin="round"/>
    <!-- Gems on peaks -->
    <circle cx="-45" cy="-18" r="5" fill="url(#gem-grad)" stroke="#0B7F78" stroke-width="1"/>
    <circle cx="-15" cy="-28" r="6" fill="#EF4444" stroke="#7F1D1D" stroke-width="1"/>
    <circle cx="15" cy="-28" r="6" fill="#EF4444" stroke="#7F1D1D" stroke-width="1"/>
    <circle cx="45" cy="-18" r="5" fill="url(#gem-grad)" stroke="#0B7F78" stroke-width="1"/>
    <!-- Center large gem -->
    <circle cy="31" r="7" fill="url(#gem-grad)" stroke="#0B7F78" stroke-width="1.5"/>
    <!-- Gloss highlight -->
    <path d="M -55 22 Q -30 18 30 18" stroke="rgba(255,255,255,0.6)" stroke-width="2" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Sparkles around crown -->
  <g fill="rgba(255,255,255,0.85)">
    <path d="M 120 90 l 3 0 l 0 -3 l 2 0 l 0 3 l 3 0 l 0 2 l -3 0 l 0 3 l -2 0 l 0 -3 l -3 0 Z"/>
    <path d="M 290 110 l 2.5 0 l 0 -2.5 l 1.5 0 l 0 2.5 l 2.5 0 l 0 1.5 l -2.5 0 l 0 2.5 l -1.5 0 l 0 -2.5 l -2.5 0 Z"/>
    <path d="M 110 230 l 2.5 0 l 0 -2.5 l 1.5 0 l 0 2.5 l 2.5 0 l 0 1.5 l -2.5 0 l 0 2.5 l -1.5 0 l 0 -2.5 l -2.5 0 Z"/>
    <path d="M 320 235 l 3 0 l 0 -3 l 2 0 l 0 3 l 3 0 l 0 2 l -3 0 l 0 3 l -2 0 l 0 -3 l -3 0 Z"/>
  </g>

  <!-- Small SP coin with "SP" text at bottom -->
  <g transform="translate(200,250)">
    <circle r="18" fill="url(#crown-grad)" stroke="#92400E" stroke-width="2"/>
    <text y="5" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="900" font-size="14" fill="#7C2D12">SP</text>
  </g>
</svg>
