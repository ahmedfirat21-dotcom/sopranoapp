<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <linearGradient id="floor" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E2A42"/>
      <stop offset="100%" stop-color="#0A1322"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(20,184,166,0.35)"/>
      <stop offset="100%" stop-color="rgba(20,184,166,0)"/>
    </radialGradient>
  </defs>

  <!-- Floor -->
  <rect y="220" width="400" height="80" fill="url(#floor)"/>

  <!-- Teal glow under microphone -->
  <ellipse cx="200" cy="240" rx="140" ry="30" fill="url(#glow)"/>

  <!-- Microphone stand -->
  <rect x="196" y="180" width="8" height="70" fill="#475569" rx="2"/>
  <rect x="160" y="250" width="80" height="6" fill="#334155" rx="3"/>

  <!-- Mic head -->
  <circle cx="200" cy="160" r="40" fill="#14B8A6"/>
  <circle cx="200" cy="160" r="40" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="2"/>
  <g stroke="#0B7F78" stroke-width="2" opacity="0.6">
    <line x1="180" y1="145" x2="220" y2="145"/>
    <line x1="175" y1="160" x2="225" y2="160"/>
    <line x1="180" y1="175" x2="220" y2="175"/>
  </g>

  <!-- Floating sound waves (empty = silent) shown as dashed -->
  <g stroke="rgba(94,234,212,0.3)" stroke-width="2" fill="none" stroke-dasharray="4 6">
    <path d="M 110 120 Q 70 80 110 40"/>
    <path d="M 290 120 Q 330 80 290 40"/>
  </g>

  <!-- Sleepy Z's -->
  <g fill="rgba(148,163,184,0.6)" font-family="system-ui, sans-serif" font-weight="bold">
    <text x="260" y="70" font-size="18">z</text>
    <text x="278" y="55" font-size="22">z</text>
    <text x="300" y="38" font-size="26">Z</text>
  </g>
</svg>
