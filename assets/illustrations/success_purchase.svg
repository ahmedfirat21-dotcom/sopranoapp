<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <radialGradient id="sglow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(34,197,94,0.35)"/>
      <stop offset="50%" stop-color="rgba(34,197,94,0.1)"/>
      <stop offset="100%" stop-color="rgba(34,197,94,0)"/>
    </radialGradient>
    <linearGradient id="check-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4ADE80"/>
      <stop offset="100%" stop-color="#16A34A"/>
    </linearGradient>
  </defs>

  <!-- Success aura -->
  <circle cx="200" cy="150" r="130" fill="url(#sglow)"/>

  <!-- Concentric ripples -->
  <g stroke="rgba(94,234,212,0.4)" stroke-width="2" fill="none" stroke-linecap="round">
    <circle cx="200" cy="150" r="70" opacity="0.5"/>
    <circle cx="200" cy="150" r="95" opacity="0.3" stroke-dasharray="5 6"/>
    <circle cx="200" cy="150" r="120" opacity="0.2" stroke-dasharray="3 8"/>
  </g>

  <!-- Main check circle -->
  <g transform="translate(200,150)">
    <circle r="55" fill="url(#check-grad)" stroke="rgba(255,255,255,0.4)" stroke-width="3"/>
    <!-- Inner gloss -->
    <ellipse cx="-12" cy="-20" rx="22" ry="14" fill="rgba(255,255,255,0.25)"/>
    <!-- Checkmark -->
    <path d="M -22 2 L -6 18 L 24 -14" stroke="white" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Confetti bits -->
  <g>
    <rect x="95" y="70" width="8" height="3" rx="1" fill="#FBBF24" transform="rotate(30 99 72)"/>
    <rect x="300" y="85" width="8" height="3" rx="1" fill="#14B8A6" transform="rotate(-20 304 87)"/>
    <rect x="85" y="220" width="8" height="3" rx="1" fill="#EC4899" transform="rotate(45 89 222)"/>
    <rect x="320" y="210" width="8" height="3" rx="1" fill="#8B5CF6" transform="rotate(-40 324 212)"/>
    <circle cx="130" cy="100" r="3" fill="#FBBF24"/>
    <circle cx="275" cy="115" r="3" fill="#22C55E"/>
    <circle cx="105" cy="180" r="2.5" fill="#5EEAD4"/>
    <circle cx="305" cy="180" r="2.5" fill="#F472B6"/>
    <!-- Sparkle stars -->
    <path d="M 340 130 l 3 0 l 0 -3 l 2 0 l 0 3 l 3 0 l 0 2 l -3 0 l 0 3 l -2 0 l 0 -3 l -3 0 Z" fill="#FBBF24"/>
    <path d="M 60 150 l 3 0 l 0 -3 l 2 0 l 0 3 l 3 0 l 0 2 l -3 0 l 0 3 l -2 0 l 0 -3 l -3 0 Z" fill="#5EEAD4"/>
  </g>

  <!-- Bouncy SP coin hint -->
  <g transform="translate(200,248)">
    <circle r="20" fill="#FBBF24" stroke="#92400E" stroke-width="2"/>
    <text y="5" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="900" font-size="14" fill="#7C2D12">+SP</text>
  </g>
</svg>
