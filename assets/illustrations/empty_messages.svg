<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <radialGradient id="mglow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(20,184,166,0.22)"/>
      <stop offset="100%" stop-color="rgba(20,184,166,0)"/>
    </radialGradient>
    <linearGradient id="envelope" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#374257"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="flap" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#2D3A4F"/>
    </linearGradient>
  </defs>

  <!-- Ambient glow -->
  <ellipse cx="200" cy="175" rx="170" ry="55" fill="url(#mglow)"/>

  <!-- Envelope body -->
  <g transform="translate(120,110)">
    <rect width="160" height="100" rx="10" fill="url(#envelope)" stroke="rgba(94,234,212,0.25)" stroke-width="1.5"/>
    <!-- Closed flap -->
    <path d="M 0 0 L 80 55 L 160 0 Z" fill="url(#flap)" stroke="rgba(94,234,212,0.2)" stroke-width="1.5"/>
    <!-- Bottom fold line -->
    <line x1="0" y1="100" x2="80" y2="60" stroke="rgba(15,23,42,0.7)" stroke-width="1"/>
    <line x1="160" y1="100" x2="80" y2="60" stroke="rgba(15,23,42,0.7)" stroke-width="1"/>
  </g>

  <!-- Empty sign (dashed circle with cross) -->
  <g transform="translate(200,160)" opacity="0.8">
    <circle r="22" fill="none" stroke="rgba(94,234,212,0.45)" stroke-width="2" stroke-dasharray="4 4"/>
    <line x1="-12" y1="0" x2="12" y2="0" stroke="rgba(94,234,212,0.55)" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Floating dust/sparkles (quiet atmosphere) -->
  <g fill="rgba(148,163,184,0.4)">
    <circle cx="80" cy="90" r="2"/>
    <circle cx="330" cy="120" r="2.5"/>
    <circle cx="60" cy="200" r="1.5"/>
    <circle cx="350" cy="220" r="2"/>
  </g>

  <!-- Message ping bubble floating (invite to send) -->
  <g transform="translate(290,80)" opacity="0.8">
    <path d="M 0 0 L 28 0 Q 36 0 36 8 L 36 20 Q 36 28 28 28 L 12 28 L 6 34 L 8 28 L 0 28 Q -8 28 -8 20 L -8 8 Q -8 0 0 0 Z" fill="#14B8A6"/>
    <circle cx="6" cy="14" r="2" fill="white"/>
    <circle cx="14" cy="14" r="2" fill="white"/>
    <circle cx="22" cy="14" r="2" fill="white"/>
  </g>
</svg>
