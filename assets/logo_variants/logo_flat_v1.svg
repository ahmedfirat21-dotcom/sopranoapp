<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5CE1E6"/>
      <stop offset="50%" stop-color="#14B8A6"/>
      <stop offset="100%" stop-color="#0B7F78"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.35)"/>
      <stop offset="50%" stop-color="rgba(255,255,255,0.05)"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0.0)"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Rounded-square background (iOS-style mask-friendly) -->
  <rect x="32" y="32" width="448" height="448" rx="112" fill="url(#bg)" filter="url(#shadow)"/>

  <!-- Speech bubble — rounded blob with tail -->
  <path d="M 140 170
           Q 140 120 190 120
           L 360 120
           Q 410 120 410 170
           L 410 300
           Q 410 350 360 350
           L 240 350
           L 200 400
           L 205 350
           L 190 350
           Q 140 350 140 300 Z"
        fill="rgba(255,255,255,0.95)"/>

  <!-- Sound waves inside bubble -->
  <g stroke="#0B7F78" stroke-width="10" stroke-linecap="round" fill="none">
    <path d="M 210 235 Q 225 220 240 235"/>
    <path d="M 195 235 Q 220 205 245 235"/>
  </g>

  <!-- Treble clef (stylized) -->
  <g transform="translate(280,175) scale(1.1)" fill="#0B7F78">
    <path d="M 0 0
             C -20 -15 -20 -50 0 -65
             C 20 -80 40 -55 30 -30
             C 25 -15 10 -5 0 5
             L 0 80
             C 0 100 -20 110 -30 95
             C -40 80 -20 70 -10 85"
          stroke="#0B7F78" stroke-width="8" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Top gloss highlight -->
  <rect x="32" y="32" width="448" height="230" rx="112" fill="url(#gloss)" pointer-events="none"/>
</svg>
