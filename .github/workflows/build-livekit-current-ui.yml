name: Build current UI LiveKit test

on:
  workflow_dispatch:
  push:
    branches:
      - fix/livekit-current-ui
      - fix/keyboard-overlay-root
      - fix/critical-audit-162
      - fix/system-lobby-stage-163

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Install dependencies
        run: npm ci

      - name: Generate Android splash resources
        run: node scripts/gen-splash-logo.js

      - name: Build standalone Android test APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon -PSOPRANOCHAT_TEST_RELEASE_WITH_DEBUG_KEY=true

      - name: Build unsigned Android App Bundle
        working-directory: android
        run: ./gradlew bundleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: sopranochat-1.7.13.163-standalone-release-apk-aab
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
