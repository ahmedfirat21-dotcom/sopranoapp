name: Build keyboard fix artifact

on:
  push:
    branches:
      - fix/keyboard-overlay-root
    paths:
      - .github/workflows/build-keyboard-fix-artifact.yml
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/keyboard-overlay-root

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Install dependencies
        run: npm ci

      - name: Generate Android splash resources
        run: node scripts/gen-splash-logo.js

      - name: Build APK and AAB
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: sopranochat-1.7.13.159-complete-android16-fix-apk-aab
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
